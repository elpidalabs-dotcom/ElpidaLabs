name: Website quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  browser-checks:
    name: Quality / ${{ matrix.browser }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit, firefox]
    env:
      TEST_BROWSERS: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run build
      - run: npm run check
      - run: npm run test:model
      - name: Verify Vercel root-domain artifact
        run: npm run test:deployment
      - name: Verify committed pages match their source
        run: git diff --exit-code -- '*.html' sitemap.xml robots.txt .nojekyll
      - name: Accessibility, metadata, keyboard and links
        if: matrix.browser == 'chromium'
        run: npm test
      - run: npm run test:experiences
      - run: npm run test:responsive
      - run: npm run test:safe-areas
      - name: Save screenshots and reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: website-checks-${{ matrix.browser }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  deploy-production:
    name: Deploy / Vercel production
    needs: browser-checks
    if: >-
      github.repository == 'elpidalabs-dotcom/ElpidaLabs' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: team_OWSJd5QW56YiwsIlCnl0P1Ce
      VERCEL_PROJECT_ID: prj_1guXziTHBmalKoep6LQ6sIvx62ML
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - name: Skip an outdated revision
        id: revision
        shell: bash
        run: |
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          test -n "$latest"
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Skipping deployment: a newer main revision exists.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Check deployment credential
        if: steps.revision.outputs.current == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo '::error::Add the VERCEL_TOKEN repository secret. See DEPLOYMENT.md.'
            exit 1
          fi
      - name: Install pinned Vercel CLI
        if: steps.revision.outputs.current == 'true'
        run: npm install --global vercel@65.12.1
      - name: Pull production settings
        if: steps.revision.outputs.current == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build production artifact
        if: steps.revision.outputs.current == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy tested revision
        if: steps.revision.outputs.current == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN" > deployment-url.txt
          printf 'Production deployment: %s\n' "$(cat deployment-url.txt)" >> "$GITHUB_STEP_SUMMARY"
