name: Website quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-checks:
    name: Quality / ${{ matrix.browser }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit, firefox]
    env:
      TEST_BROWSERS: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run build
      - run: npm run check
      - run: npm run test:model
      - name: Verify committed pages match their source
        run: git diff --exit-code -- '*.html' sitemap.xml .nojekyll
      - name: Accessibility, metadata, keyboard and links
        if: matrix.browser == 'chromium'
        run: npm test
      - run: npm run test:experiences
      - run: npm run test:responsive
      - run: npm run test:safe-areas
      - name: Save screenshots and reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: website-checks-${{ matrix.browser }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
